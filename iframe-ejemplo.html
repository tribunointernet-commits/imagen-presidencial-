<!-- Cambiar URL_PUBLICA por la dirección real del archivo publicado en GitHub Pages. -->
<iframe id="ranking-presidentes-2026" title="Ranking interactivo de imagen de presidentes latinoamericanos, octubre de 2026" src="URL_PUBLICA" width="100%" height="1750" loading="lazy" style="display:block;width:100%;border:0;max-width:100%;overflow:hidden" scrolling="no"></iframe>
<script>
(function(){
  const iframe=document.getElementById('ranking-presidentes-2026');
  const trustedOrigin=new URL(iframe.src,window.location.href).origin;
  window.addEventListener('message',function(event){
    if(event.origin!==trustedOrigin || event.source!==iframe.contentWindow) return;
    if(event.data?.type==='eltribuno-ranking-height' && Number.isFinite(event.data.height)) {
      iframe.style.height=Math.max(200,Math.min(10000,Math.ceil(event.data.height)))+'px';
    }
  });
})();
</script>
